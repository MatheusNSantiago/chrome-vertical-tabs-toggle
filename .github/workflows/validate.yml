name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  python:
    name: Python and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Linux accessibility bindings
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gir1.2-atspi-2.0 \
            python3-gi
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --locked --all-groups
      - name: Check code
        run: uv run ruff check
      - name: Run tests
        run: uv run python -m unittest discover -s tests
      - name: Run AT-SPI tests
        env:
          PYTHONPATH: native-host/linux
        run: /usr/bin/python3 -m unittest discover -s tests/linux

  macos:
    name: Build macOS host
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal host
        run: native-host/macos/build.sh
      - name: Inspect bundle
        run: |
          plutil -lint "native-host/macos/dist/Chrome Vertical Tabs Toggle.app/Contents/Info.plist"
          lipo -verify_arch x86_64 arm64 \
            "native-host/macos/dist/Chrome Vertical Tabs Toggle.app/Contents/MacOS/ChromeVerticalTabsToggle"
          codesign --verify "native-host/macos/dist/Chrome Vertical Tabs Toggle.app"

  windows:
    name: Build Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build host
        shell: powershell
        run: native-host/windows/build.ps1
      - name: Inspect bundle
        shell: powershell
        run: |
          $Files = @(
            "ChromeVerticalTabsToggle.exe",
            "ChromeVerticalTabsToggle.exe.config",
            "install.cmd",
            "install.ps1",
            "native-host-contract.json",
            "sidebar-labels.json"
          )
          foreach ($File in $Files) {
            if (-not (Test-Path "native-host/windows/dist/windows/$File")) {
              throw "Missing release file: $File"
            }
          }
